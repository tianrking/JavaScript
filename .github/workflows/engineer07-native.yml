name: Engineer07 native queue validation
on:
  push:
    branches:
      - codex/native-key-queue-green
permissions:
  contents: read
jobs:
  fixed-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Format regression source with project Prettier
        run: npx prettier Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js --write
      - name: Record fixed production and regression source
        run: |
          node --version
          git rev-parse HEAD
          git hash-object Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          sha256sum Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
      - name: Fixed native queue regressions
        run: npm test -- Data-Structures/Heap/test/KeyPriorityQueue.test.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
      - name: Full native test suite
        run: npm test
      - name: Whole project Prettier check
        run: npm run check-style
      - name: Native project coverage
        run: npm test -- --coverage
      - name: Verify final native source
        if: always()
        run: |
          git hash-object Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          sha256sum Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          git diff --exit-code -- Data-Structures/Heap/KeyPriorityQueue.js
      - name: Save formatted source and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-queue-source-and-coverage
          path: |
            Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
            coverage/coverage-final.json
