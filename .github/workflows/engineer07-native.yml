name: Engineer07 native queue validation
on:
  push:
    branches:
      - codex/native-key-queue-final
permissions:
  contents: read
jobs:
  fixed-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: d00827c097c4faa460100501edadb0415b7d6d28
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Check regression source with project Prettier
        run: npx prettier Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js --check
      - name: Record fixed production and regression source
        run: |
          node --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "d00827c097c4faa460100501edadb0415b7d6d28"
          test "$(git hash-object Data-Structures/Heap/KeyPriorityQueue.js)" = "08c7ca7b412341632475014f5785932f61b0e422"
          test "$(git hash-object Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js)" = "fb29212f41e46e403174e1dd2e2b5b4bb57df0c3"
          git hash-object Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          sha256sum Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
      - name: Fixed native queue regressions
        run: npm test -- Data-Structures/Heap/test/KeyPriorityQueue.test.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
      - name: Full native test suite
        run: npm test
      - name: Whole project Prettier check
        run: npm run check-style
      - name: Native project coverage
        run: npm test -- --coverage
      - name: Verify final native source
        if: always()
        run: |
          git hash-object Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          sha256sum Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          test "$(git rev-parse HEAD)" = "d00827c097c4faa460100501edadb0415b7d6d28"
          test "$(git hash-object Data-Structures/Heap/KeyPriorityQueue.js)" = "08c7ca7b412341632475014f5785932f61b0e422"
          test "$(git hash-object Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js)" = "fb29212f41e46e403174e1dd2e2b5b4bb57df0c3"
          git rev-parse HEAD
          git diff --exit-code
      - name: Save formatted source and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-queue-source-and-coverage
          path: |
            Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
            coverage/coverage-final.json
