name: Engineer07 native queue validation
on:
  push:
    branches:
      - codex/native-key-queue-red
permissions:
  contents: read
jobs:
  original-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Record original production and regression source
        run: |
          node --version
          git rev-parse HEAD
          test "$(git hash-object Data-Structures/Heap/KeyPriorityQueue.js)" = "420933396e361b804dfad30064f3bb75b5041f67"
          git hash-object Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          sha256sum Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
      - name: Existing native queue tests
        run: npm test -- Data-Structures/Heap/test/KeyPriorityQueue.test.js
      - name: Original native infinite priority regressions
        run: npm test -- Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
      - name: Verify unchanged original source
        if: always()
        run: |
          git hash-object Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          sha256sum Data-Structures/Heap/KeyPriorityQueue.js Data-Structures/Heap/test/KeyPriorityQueueInfinity.test.js
          git diff --exit-code
